name: "Disk & Battery Watch"
version: "1.0.0"
slug: "disk-battery-watch"
description: "Monitors disk S.M.A.R.T. health and battery/UPS status on the host. Structured smartctl JSON parsing, MQTT discovery entities with REST fallback"
url: "https://github.com/michauMiau/proxy_hass_app"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
homeassistant: "2024.10.0"
startup: system
boot: auto
init: false
privileged:
  - SYS_ADMIN
  - SYS_RAWIO
devices:
  - /dev
map: []
tmpfs: false
environment: {}
services: []
options:
  disks: []
  check_interval: 300
  battery_interval: 60
  publish_attributes: true
  mqtt_enabled: true
  mqtt_host: "core-mqtt"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  disks:
    - "device(subsystem=block)"
  check_interval: "int(30,86400)"
  battery_interval: "int(10,3600)"
  publish_attributes: bool
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: "int(1,65535)"
  mqtt_username: str
  mqtt_password: str
